[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-terminal"
version = "0.1.0"
description = "A live terminal dashboard that categorizes your X (Twitter) feed into custom categories"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# passbot: World Cup per-player pass predictor. Kept optional so the X
# Terminal install stays lean — `pip install -e .[passbot]` to enable it.
passbot = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
]

[project.scripts]
x-terminal = "x_terminal.cli:main"
passbot = "passbot.cli:main"

[tool.setuptools.packages.find]
include = ["x_terminal*", "passbot*"]

[tool.setuptools.package-data]
x_terminal = ["*.tcss"]
