[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-terminal"
version = "0.1.0"
description = "A live terminal dashboard that categorizes your X (Twitter) feed into custom categories"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
x-terminal = "x_terminal.cli:main"

[tool.setuptools.packages.find]
include = ["x_terminal*"]

[tool.setuptools.package-data]
x_terminal = ["*.tcss"]
